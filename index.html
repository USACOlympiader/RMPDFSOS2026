<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Viewer</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #1e1e1e;
    }

    .topbar {
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      background: #292929;
      color: white;
    }

    .title {
      font-size: 18px;
      font-weight: bold;
    }

    .open-button {
      padding: 9px 16px;
      border: none;
      border-radius: 6px;
      background: #4f8cff;
      color: white;
      cursor: pointer;
      font-size: 14px;
    }

    .open-button:hover {
      background: #3678e8;
    }

    iframe {
      display: block;
      width: 100%;
      height: calc(100vh - 60px);
      border: none;
    }
  </style>
</head>

<body>

  <div class="topbar">
    <div class="title" id="title"></div>

    <div>
      <button
        id="switchButton"
        class="open-button"
        onclick="switchPDF()"
      >
      </button>
    </div>
  </div>

  <iframe id="pdfViewer"></iframe>

  <script>
    const rocksPDF = "MIT_2026_RocksMinerals_Answer_Key.pdf";
    const boomileverPDF = "boomilever-build-guide.pdf";

    // "rocks" or "boomilever"
    let currentPDF = "rocks";

    function showRocksPDF() {
      currentPDF = "rocks";

      document.getElementById("pdfViewer").src = rocksPDF;

      document.getElementById("title").textContent =
        "Rocks and Minerals AI Generated Answer Key";

      document.getElementById("switchButton").textContent =
        "Open Boomilever Guide";
    }

    function showBoomileverPDF() {
      currentPDF = "boomilever";

      document.getElementById("pdfViewer").src = boomileverPDF;

      document.getElementById("title").textContent =
        "Boomilever AI Generated Build Guide";

      document.getElementById("switchButton").textContent =
        "Open Rocks & Minerals Answer Key";
    }

    function switchPDF() {
      if (currentPDF === "rocks") {
        showBoomileverPDF();
      } else {
        showRocksPDF();
      }
    }

    // Automatically load the Rocks & Minerals PDF
    showRocksPDF();
  </script>

</body>
</html>
